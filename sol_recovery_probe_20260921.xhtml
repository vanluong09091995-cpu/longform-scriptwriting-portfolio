<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>CUA_XHTML_WAIT</title></head>
<body><div id="out">WAIT</div>
<script type="application/javascript"><![CDATA[
(async()=>{
 const el=document.getElementById('out');
 try{
  const r=await fetch('http://127.0.0.1:10789/api/v1/tools/call',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({name:'automation_safety',arguments:{operation:'status'}})
  });
  const t=await r.text();
  document.title='CUA_XHTML_'+r.status;
  el.textContent='HTTP '+r.status+' '+t;
 }catch(e){
  document.title='CUA_XHTML_ERR';
  el.textContent='ERR '+String(e);
 }
})();
]]></script>
</body></html>
