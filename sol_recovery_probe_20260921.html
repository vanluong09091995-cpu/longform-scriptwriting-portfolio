<!doctype html>
<meta charset="utf-8">
<title>CUA_RECOVERY_WAIT</title>
<body>CUA recovery probe...</body>
<script>
(async()=>{
 try{
  const r=await fetch('http://127.0.0.1:10789/api/v1/tools/call',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({name:'automation_safety',arguments:{operation:'status'}})
  });
  const t=await r.text();
  document.title='CUA_RECOVERY_'+r.status;
  document.body.textContent=t;
 }catch(e){
  document.title='CUA_RECOVERY_ERR';
  document.body.textContent=String(e);
 }
})();
</script>
